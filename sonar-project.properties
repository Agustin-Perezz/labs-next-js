# SonarCloud project configuration
# https://docs.sonarsource.com/sonarqube/latest/project-administration/analysis-parameters/

sonar.projectKey=Agustin-Perezz_labs-next-js
sonar.organization=general-organization
sonar.projectName=labs-next-js
sonar.projectDescription=Next.js (App Router) starter with base-ui, shadcn, Biome, and Playwright E2E.

# Source code layout
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions — generated/vendored/build output should not be analyzed
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.d.ts,\
  **/next-env.d.ts

# Test file patterns (counted as tests, not as production code)
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage scope — only files with deliberate unit tests are measured
# (currently src/hooks/**; add new intents to vitest.config.ts
# `coverage.include` first). Pages, layouts, and server actions are exercised
# through Playwright E2E, not unit tests. Components — whether shared
# primitives in src/components/** or per-feature components in
# src/app/**/components/** — are also exercised through E2E.
#
# Sonar has no coverage whitelist property: any source file absent from the LCOV
# report is counted as 0% covered unless it is listed here. This list is the
# complement of vitest.config.ts `coverage.include`/`coverage.exclude` — what is
# NOT instrumented by vitest MUST be excluded here, or it tanks the gate. Keep
# the two in lockstep. Adding a new top-level src/ directory (e.g.
# src/services/) that gets unit tests requires: (1) adding it to vitest
# `coverage.include`, and (2) NOT adding it to the exclusions below.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**,\
  src/components/**,\
  src/app/**/components/**,\
  src/app/**/page.tsx,\
  src/app/**/layout.tsx,\
  src/app/**/actions.ts,\
  src/lib/**,\
  src/sentry.client.config.ts,\
  src/sentry.edge.config.ts,\
  src/sentry.server.config.ts,\
  src/instrumentation.ts

# Coverage report — produced by `pnpm test:coverage` (Vitest + @vitest/coverage-istanbul).
# SonarJS (the JS/TS analyzer) ingests LCOV via this property.
sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# Quality Gate is enforced via SonarCloud's GitHub PR decoration (project is bound to GitHub).
# The scanner does not poll the Quality Gate — SonarCloud posts it as a GitHub PR check instead.
# Enable branch protection on "SonarCloud Code Analysis" check to block merges on Quality Gate failure.